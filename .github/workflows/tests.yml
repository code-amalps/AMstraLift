name: Tests

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure Git author identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        id: test_linux
        run: |
          xvfb-run -a uv run pytest -v --tb=short 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Run Test Suite (Windows / macOS)
        if: runner.os != 'Linux'
        id: test_other
        run: |
          uv run pytest -v --tb=short 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Publish Test Summary
        if: always()
        run: |
          python -c '
          import os
          if os.path.exists("pytest_output.log"):
              text = open("pytest_output.log", encoding="utf-8", errors="replace").read()
              esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Pytest Error Log::{esc}")
          '
          echo "## Test Suite Results (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          if [ -f pytest_output.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.os }}
          path: pytest_output.log
          if-no-files-found: ignore

      - name: Validate Test Run Exit Status
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ "${{ steps.test_linux.outcome }}" != "success" ]; then
              echo "Tests failed on Linux."
              exit 1
            fi
          else
            if [ "${{ steps.test_other.outcome }}" != "success" ]; then
              echo "Tests failed on ${{ matrix.os }}."
              exit 1
            fi
          fi
