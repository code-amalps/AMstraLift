name: Build & Release AMstraLift Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
      release_name:
        description: 'Release Title'
        required: false
        default: 'AMstraLift Windows Release'
        type: string
      draft:
        description: 'Draft release (hidden until reviewed)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Build standalone executable with PyInstaller
        run: |
          uv run --with pyinstaller pyinstaller --name amstralift --onefile --clean --collect-all amstralift amstralift/cli.py

      - name: Verify compiled executable
        run: |
          .\dist\amstralift.exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: amstralift-windows-x64
          path: dist/amstralift.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          files: dist/amstralift.exe
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
